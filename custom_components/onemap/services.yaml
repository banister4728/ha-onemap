reverse_geocode:
  fields:
    latitude:
      required: true
      example: 1.3011
      selector:
        number:
          min: 1.1
          max: 1.5
          step: any
          mode: box
    longitude:
      required: true
      example: 103.9053
      selector:
        number:
          min: 103.5
          max: 104.1
          step: any
          mode: box
    buffer:
      default: 100
      selector:
        number:
          min: 0
          max: 500
          step: 10
          unit_of_measurement: m

search:
  fields:
    query:
      required: true
      example: Parkway Parade
      selector:
        text:
    page:
      default: 1
      selector:
        number:
          min: 1
          max: 100
          mode: box
